<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f1e8">
  <title>Offline · Money Control</title>
  <link rel="icon" href="/pwa/icon-192.png">
  <!-- Served by the service worker in place of a page that couldn't load.
       Self-contained on purpose: no app CSS or JS is guaranteed to be cached. -->
  <style>
    :root { --paper: #f4f1e8; --ink: #16150f; --muted: #5c594b; --spend: #d8401c; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font: 15px/1.55 "Instrument Sans", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      padding: max(64px, env(safe-area-inset-top)) max(22px, env(safe-area-inset-right)) 48px max(22px, env(safe-area-inset-left));
    }
    main { max-width: 640px; margin: 0 auto; }
    .eyebrow { font: 500 10px/1 "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
    h1 { font: 400 clamp(40px, 9vw, 56px)/1.05 "Instrument Serif", Georgia, "Times New Roman", serif; margin: 10px 0 20px; }
    h1 span { color: var(--spend); }
    .double-rule { display: flex; flex-direction: column; gap: 3px; }
    .double-rule::before, .double-rule::after { content: ""; background: var(--ink); }
    .double-rule::before { height: 3px; }
    .double-rule::after { height: 1px; }
    p { margin-top: 24px; color: var(--muted); max-width: 52ch; }
    button {
      margin-top: 28px;
      padding: 10px 15px;
      border: 0;
      border-radius: 0;
      background: var(--ink);
      color: var(--paper);
      font: 600 11px/1 "IBM Plex Mono", ui-monospace, monospace;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: progress; }
    button:focus-visible { outline: 2px solid var(--spend); outline-offset: 2px; }
    .status { margin-top: 14px; font: 400 11px/1.4 "IBM Plex Mono", ui-monospace, monospace; color: var(--muted); min-height: 1.4em; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Money Control</p>
    <h1>Off the wire<span>.</span></h1>
    <div class="double-rule"></div>
    <p>This page needs a connection and the device doesn&rsquo;t have one right now. Your book is kept on the server, not on this phone, so nothing in it is lost. The page will reload on its own once you&rsquo;re back online.</p>
    <button type="button" id="retry">Try again</button>
    <div class="status" id="status" role="status" aria-live="polite"></div>
  </main>
  <script>
    (function () {
      var button = document.getElementById("retry");
      var status = document.getElementById("status");
      function retry() {
        button.disabled = true;
        status.textContent = "Checking the connection…";
        location.reload();
      }
      button.addEventListener("click", retry);
      window.addEventListener("online", retry);
      // navigator.onLine can be true on a network that goes nowhere (captive portal, dead upstream).
      window.addEventListener("pageshow", function () {
        button.disabled = false;
        status.textContent = navigator.onLine ? "The device reports a network, but Money Control can’t be reached from it." : "";
      });
    })();
  </script>
</body>
</html>
